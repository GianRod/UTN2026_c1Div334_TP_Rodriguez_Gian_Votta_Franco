<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenida — Autoservicio</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body data-page="bienvenida">

  <header class="app-header">
    <div class="brand">
      <img src="../assets/logo.png" alt="Logo" class="logo" onerror="this.style.display='none'" />
      <span class="app-name">Autoservicio</span>
    </div>
    <nav class="main-nav">
      <a href="bienvenida.html">Inicio</a>
      <a href="productos.html">Productos</a>
      <a href="carrito.html">Carrito <span id="nav-cart-count" class="badge">0</span></a>
      <a href="../backend/admin/login" class="nav-admin">Admin</a>
    </nav>
  </header>

  <main class="bienvenida-main">
    <section class="bienvenida-card">
      <h1>¡Bienvenido!</h1>
      <p>Para comenzar, ingresá tu nombre:</p>
      <form id="form-nombre">
        <input
          type="text"
          id="input-nombre"
          placeholder="Tu nombre"
          maxlength="50"
          autocomplete="off"
          required
        />
        <button type="submit" class="btn btn-primary">Continuar</button>
      </form>
      <p id="error-nombre" class="error hidden">Por favor ingresá tu nombre.</p>
    </section>
    <p class="alumnos">Franco Votta / Gian Rodriguez— Programación III 2025</p>
  </main>

  <script src="../js/bienvenida.js"></script>
</body>
</html>
